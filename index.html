<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChartSentinel</title>
    <script>
      window.addEventListener('error', function(event) {
        const errorDiv = document.createElement('div');
        errorDiv.style.position = 'fixed';
        errorDiv.style.top = '0';
        errorDiv.style.left = '0';
        errorDiv.style.width = '100%';
        errorDiv.style.background = 'red';
        errorDiv.style.color = 'white';
        errorDiv.style.zIndex = '9999';
        errorDiv.style.padding = '10px';
        errorDiv.style.fontFamily = 'monospace';
        errorDiv.innerText = 'Error: ' + event.message + '\n' + event.filename + ':' + event.lineno;
        document.body.appendChild(errorDiv);
      });
      window.addEventListener('unhandledrejection', function(event) {
        const errorDiv = document.createElement('div');
        errorDiv.style.position = 'fixed';
        errorDiv.style.top = '0';
        errorDiv.style.left = '0';
        errorDiv.style.width = '100%';
        errorDiv.style.background = 'orange';
        errorDiv.style.color = 'white';
        errorDiv.style.zIndex = '9998';
        errorDiv.style.padding = '10px';
        errorDiv.style.fontFamily = 'monospace';
        errorDiv.innerText = 'Unhandled Rejection: ' + (event.reason ? event.reason.stack || event.reason : 'Unknown');
        document.body.appendChild(errorDiv);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
